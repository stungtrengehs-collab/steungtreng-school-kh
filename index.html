<!DOCTYPE html>
<html lang="km" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>វិទ្យាល័យឥស្លាមស្ទឹងត្រែង - School Attendance & Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                        islamic: {
                            gold: '#d97706',
                            dark: '#0f172a'
                        }
                    },
                    fontFamily: {
                        sans: ['"Inter"', '"Hanuman"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Hanuman & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Hanuman:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Scanner Library (Html5-Qrcode) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <!-- QR Code Generator Library (QRCode.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- SheetJS for Excel Export/Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Hanuman', 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-full flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4"></div>

    <!-- App Wrapper -->
    <div id="app-root" class="w-full max-w-md mx-auto bg-slate-50 h-full flex flex-col shadow-2xl relative overflow-hidden">

        <!-- Top Header Bar -->
        <header class="bg-gradient-to-r from-emerald-900 via-emerald-800 to-green-900 text-white px-4 py-3 flex items-center justify-between shadow-md shrink-0 z-20">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-amber-500 flex items-center justify-center text-white shadow font-bold text-lg border-2 border-amber-300">
                    <i class="fa-solid fa-mosque"></i>
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <h1 class="font-bold text-sm tracking-tight text-emerald-100">វិទ្យាល័យឥស្លាមស្ទឹងត្រែង</h1>
                        <button onclick="forceCloudSyncAllData()" class="bg-emerald-700/80 hover:bg-emerald-600 text-emerald-100 text-[9px] px-2 py-0.5 rounded-full font-bold border border-emerald-400 flex items-center gap-1 shadow-sm transition active:scale-95" title="ចុចត្រង់នេះដើម្បីបង្ខំឱ្យ Sync ទិន្នន័យពី Cloud ភ្លាមៗ">
                            <i class="fa-solid fa-rotate text-[10px] animate-spin" id="sync-spin-icon" style="animation-duration: 3s;"></i>
                            <span id="cloud-status-badge-text">Sync Cloud ភ្លាមៗ</span>
                        </button>
                    </div>
                    <p class="text-[10px] text-emerald-300">Steung Treng Islamic High School</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="toggleAutoTelegram()" id="auto-tg-btn" class="px-2 py-1 rounded-lg text-[10px] font-bold shadow uppercase transition flex items-center gap-1 bg-emerald-800 text-emerald-200 border border-emerald-600/50" title="ចុចដើម្បី បើក/បិទ សារស្វ័យប្រវត្តិទៅ Telegram">
                    <i class="fa-paper-plane fa-solid text-[9px]"></i>
                    <span id="auto-tg-status-text">សារស្វ័យប្រវត្តិ: បើក</span>
                </button>
                <button onclick="openSettingsModal()" class="w-9 h-9 rounded-full bg-emerald-800/80 hover:bg-emerald-700 flex items-center justify-center text-emerald-200 transition" title="ការកំណត់ប្រព័ន្ធ">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
                <button onclick="switchUserRolePrompt()" id="user-role-badge" class="px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-[10px] font-bold shadow uppercase transition flex items-center gap-1 cursor-pointer">
                    <i class="fa-solid fa-shield-halved text-[9px]"></i>
                    <span id="role-text-display">Admin</span>
                </button>
            </div>
        </header>

        <!-- Main Dynamic Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-24 relative hide-scrollbar">
            <!-- Dynamic tab views will be injected here -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md border-t border-emerald-900/40 px-3 py-2 flex justify-around items-center z-30 shadow-2xl">
            <button onclick="switchTab('scanner')" id="nav-btn-scanner" class="flex flex-col items-center justify-center w-14 py-1 text-emerald-400 font-medium transition-all duration-200 hover:scale-105 active:scale-95">
                <i class="fa-solid fa-qrcode text-lg mb-0.5"></i>
                <span class="text-[10px] tracking-tight">ស្កែន QR</span>
            </button>
            <button onclick="switchTab('attendance')" id="nav-btn-attendance" class="flex flex-col items-center justify-center w-14 py-1 text-slate-400 hover:text-emerald-400 font-medium transition-all duration-200 hover:scale-105 active:scale-95">
                <i class="fa-solid fa-clipboard-user text-lg mb-0.5"></i>
                <span class="text-[10px] tracking-tight">វត្តមាន</span>
            </button>
            <button onclick="switchTab('people')" id="nav-btn-people" class="flex flex-col items-center justify-center w-14 py-1 text-slate-400 hover:text-emerald-400 font-medium transition-all duration-200 hover:scale-105 active:scale-95">
                <i class="fa-solid fa-users text-lg mb-0.5"></i>
                <span class="text-[10px] tracking-tight">សិស្ស-គ្រូ</span>
            </button>
            <button onclick="switchTab('timetable')" id="nav-btn-timetable" class="flex flex-col items-center justify-center w-14 py-1 text-slate-400 hover:text-emerald-400 font-medium transition-all duration-200 hover:scale-105 active:scale-95">
                <i class="fa-solid fa-calendar-days text-lg mb-0.5"></i>
                <span class="text-[10px] tracking-tight">កាលវិភាគ</span>
            </button>
            <button onclick="switchTab('reports')" id="nav-btn-reports" class="flex flex-col items-center justify-center w-14 py-1 text-slate-400 hover:text-emerald-400 font-medium transition-all duration-200 hover:scale-105 active:scale-95">
                <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i>
                <span class="text-[10px] tracking-tight">របាយការណ៍</span>
            </button>
        </nav>

    </div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- Firebase & App Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State Initialization Guard
        window.appState = {
            currentTab: 'scanner',
            role: 'Admin',
            scannerMode: 'student',
            isCameraActive: true,
            selectedClassFilter: '7A',
            selectedReportClassFilter: 'ALL',
            adminPin: localStorage.getItem('st_admin_pin') || '1234',
            classes: JSON.parse(localStorage.getItem('st_classes') || '["7A", "7B", "8A", "8B", "9A", "9B", "10A", "11A", "12A"]'),
            students: JSON.parse(localStorage.getItem('st_students') || '[]'),
            teachers: JSON.parse(localStorage.getItem('st_teachers') || '[]'),
            attendance: JSON.parse(localStorage.getItem('st_attendance') || '[]'),
            timetable: JSON.parse(localStorage.getItem('st_timetable') || '[]'),
            googleSheetUrl: localStorage.getItem('st_gsheet_url') || 'https://script.google.com/macros/s/AKfycbyhca0dGNj8CV41xUzZZcGUplmuoAQ3kCzg2jN0M8VLo3Gva1RDzlKPcpx4CZNC-0zPsw/exec',
            telegramConfig: {
                botToken: localStorage.getItem('st_bot_token') || '',
                defaultChatId: localStorage.getItem('st_chat_id') || '',
                classChatIds: JSON.parse(localStorage.getItem('st_class_chat_ids') || '{}'),
                autoSendOnScan: localStorage.getItem('st_auto_tg_send') !== 'false'
            }
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'steung-treng-islamic-school-v1';
        
        const firebaseConfig = {
            apiKey: "AIzaSyAAQJ3bGUB_XR6Z4hSsKV_XLfYh8-tl15c",
            authDomain: "hanastungtreng1111.firebaseapp.com",
            projectId: "hanastungtreng1111",
            storageBucket: "hanastungtreng1111.firebasestorage.app",
            messagingSenderId: "63757898367",
            appId: "1:63757898367:web:7d9054076c94cad24ce54a",
            measurementId: "G-HZ1MQS4ZLF"
        };

        let app, db, auth;
        let currentUser = null;
        let isFirebaseConnected = false;
        let html5QrCode = null;
        let isProcessingScan = false;

        function loadLocalMockData() {
            try {
                window.appState.students = JSON.parse(localStorage.getItem('st_students') || '[]');
                window.appState.teachers = JSON.parse(localStorage.getItem('st_teachers') || '[]');
                window.appState.attendance = JSON.parse(localStorage.getItem('st_attendance') || '[]');
                window.appState.timetable = JSON.parse(localStorage.getItem('st_timetable') || '[]');
            } catch (e) {
                console.warn("Local mock load note:", e);
            }
        }

        async function initApp() {
            try {
                loadLocalMockData();

                if (typeof initializeApp !== 'undefined') {
                    app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                        currentUser = auth.currentUser;
                        if (currentUser) {
                            isFirebaseConnected = true;
                            console.log("🔥 Firebase initialized & Authenticated successfully!");
                            setupRealtimeListeners();
                            await window.forceCloudSyncAllData();
                        }
                    } catch (authErr) {
                        console.warn("⚠️ Firebase auth note:", authErr);
                    }
                }
            } catch (e) {
                console.warn("⚠️ Firebase connection fallback active:", e);
            }

            setTimeout(() => {
                renderCurrentTab();
                updateNavActiveState();
            }, 300);
        }

        function setupRealtimeListeners() {
            if (!isFirebaseConnected) return;

            const getColRef = (col) => collection(db, 'artifacts', appId, 'public', 'data', col);

            onSnapshot(getColRef('attendance'), (snapshot) => {
                const list = [];
                snapshot.forEach(doc => list.push({ firebaseId: doc.id, ...doc.data() }));
                if (list.length > 0) {
                    window.appState.attendance = list.sort((a,b) => new Date(b.time) - new Date(a.time));
                    saveToLocalStorage();
                    if (window.appState.currentTab === 'attendance' || window.appState.currentTab === 'reports') renderCurrentTab();
                }
            }, (err) => console.log("Attendance snapshot note:", err));

            onSnapshot(getColRef('students'), (snapshot) => {
                const list = [];
                snapshot.forEach(doc => list.push({ firebaseId: doc.id, ...doc.data() }));
                if (list.length > 0) {
                    window.appState.students = list;
                    saveToLocalStorage();
                    if (window.appState.currentTab === 'people') renderCurrentTab();
                }
            }, (err) => console.log("Students snapshot note:", err));

            onSnapshot(getColRef('teachers'), (snapshot) => {
                const list = [];
                snapshot.forEach(doc => list.push({ firebaseId: doc.id, ...doc.data() }));
                if (list.length > 0) {
                    window.appState.teachers = list;
                    saveToLocalStorage();
                    if (window.appState.currentTab === 'people') renderCurrentTab();
                }
            }, (err) => console.log("Teachers snapshot note:", err));
        }

        window.forceCloudSyncAllData = async function() {
            if (!isFirebaseConnected) {
                showToast("ប្រព័ន្ធមិនទាន់ភ្ជាប់ Cloud! សូមពិនិត្យអ៊ីនធឺណិត", "error");
                return;
            }
            const spinIcon = document.getElementById('sync-spin-icon');
            if (spinIcon) spinIcon.classList.add('fa-spin');

            try {
                const getColRef = (col) => collection(db, 'artifacts', appId, 'public', 'data', col);
                
                const attSnap = await getDocs(getColRef('attendance'));
                const attList = [];
                attSnap.forEach(doc => attList.push({ firebaseId: doc.id, ...doc.data() }));
                if (attList.length > 0) {
                    window.appState.attendance = attList.sort((a,b) => new Date(b.time) - new Date(a.time));
                }

                const stuSnap = await getDocs(getColRef('students'));
                const stuList = [];
                stuSnap.forEach(doc => stuList.push({ firebaseId: doc.id, ...doc.data() }));
                if (stuList.length > 0) window.appState.students = stuList;

                const teaSnap = await getDocs(getColRef('teachers'));
                const teaList = [];
                teaSnap.forEach(doc => teaList.push({ firebaseId: doc.id, ...doc.data() }));
                if (teaList.length > 0) window.appState.teachers = teaList;

                saveToLocalStorage();
                renderCurrentTab();
                showToast("ទាញយកទិន្នន័យចុងក្រោយពី Cloud ជោគជ័យ!", "success");
            } catch (e) {
                console.error("Force sync error:", e);
                showToast("មានបញ្ហាក្នុងការ Sync ពី Cloud", "error");
            } finally {
                if (spinIcon) spinIcon.classList.remove('fa-spin');
            }
        }

        async function syncToFirebase(collectionName, itemId, data) {
            saveToLocalStorage();
            if (!isFirebaseConnected) return;
            try {
                const cleanData = JSON.parse(JSON.stringify(data));
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', collectionName, String(itemId));
                await setDoc(docRef, cleanData, { merge: true });
                console.log(`✅ Push Cloud Done [${collectionName}]:`, itemId);
            } catch (e) {
                console.error("Firebase sync error:", e);
            }
        }

        async function deleteFromFirebase(collectionName, itemId) {
            saveToLocalStorage();
            if (!isFirebaseConnected) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', collectionName, String(itemId));
                await deleteDoc(docRef);
                console.log(`🗑️ Cloud Deleted [${collectionName}]:`, itemId);
            } catch (e) {
                console.error("Firebase delete error:", e);
            }
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem('st_students', JSON.stringify(window.appState.students || []));
                localStorage.setItem('st_teachers', JSON.stringify(window.appState.teachers || []));
                localStorage.setItem('st_attendance', JSON.stringify(window.appState.attendance || []));
                localStorage.setItem('st_timetable', JSON.stringify(window.appState.timetable || []));
                localStorage.setItem('st_classes', JSON.stringify(window.appState.classes || []));
                localStorage.setItem('st_gsheet_url', window.appState.googleSheetUrl || '');
                localStorage.setItem('st_bot_token', window.appState.telegramConfig.botToken || '');
                localStorage.setItem('st_chat_id', window.appState.telegramConfig.defaultChatId || '');
                localStorage.setItem('st_class_chat_ids', JSON.stringify(window.appState.telegramConfig.classChatIds || {}));
                localStorage.setItem('st_auto_tg_send', window.appState.telegramConfig.autoSendOnScan ? 'true' : 'false');
            } catch (e) {
                console.error("Local Storage Save Error:", e);
            }
        }

        window.toggleAutoTelegram = function() {
            window.appState.telegramConfig.autoSendOnScan = !window.appState.telegramConfig.autoSendOnScan;
            saveToLocalStorage();
            updateNavActiveState();
            showToast(window.appState.telegramConfig.autoSendOnScan ? "បានបើកសារស្វ័យប្រវត្តិទៅ Telegram" : "បានបិទសារស្វ័យប្រវត្តិទៅ Telegram", "info");
        }

        window.switchUserRolePrompt = function() {
            const currentRole = window.appState.role;
            if (currentRole === 'Admin') {
                window.appState.role = 'Teacher';
                showToast("បានផ្លាស់ប្តូរទៅជាសិទ្ធិ «គ្រូបង្រៀន (Teacher)»", "info");
                updateNavActiveState();
                renderCurrentTab();
            } else {
                promptAdminPinVerification(() => {
                    window.appState.role = 'Admin';
                    showToast("បានផ្លាស់ប្តូរទៅជាសិទ្ធិ «អ្នកគ្រប់គ្រង (Admin)»", "success");
                    updateNavActiveState();
                    renderCurrentTab();
                });
            }
        }

        function updateNavActiveState() {
            ['scanner', 'attendance', 'people', 'timetable', 'reports'].forEach(tab => {
                const btn = document.getElementById(`nav-btn-${tab}`);
                if (btn) {
                    if (tab === window.appState.currentTab) {
                        btn.className = "flex flex-col items-center justify-center w-14 py-1 text-emerald-400 font-bold transition-all duration-200 scale-105";
                    } else {
                        btn.className = "flex flex-col items-center justify-center w-14 py-1 text-slate-400 hover:text-emerald-400 font-medium transition-all duration-200";
                    }
                }
            });

            const roleBadge = document.getElementById('role-text-display');
            if (roleBadge) roleBadge.innerText = window.appState.role;

            const autoTgText = document.getElementById('auto-tg-status-text');
            const autoTgBtn = document.getElementById('auto-tg-btn');
            if (autoTgText && autoTgBtn) {
                const active = window.appState.telegramConfig.autoSendOnScan;
                autoTgText.innerText = active ? "សារស្វ័យប្រវត្តិ: បើក" : "សារស្វ័យប្រវត្តិ: បិទ";
                autoTgBtn.className = active ? "px-2 py-1 rounded-lg text-[10px] font-bold shadow uppercase transition flex items-center gap-1 bg-emerald-700 text-emerald-100 border border-emerald-500" : "px-2 py-1 rounded-lg text-[10px] font-bold shadow uppercase transition flex items-center gap-1 bg-slate-800 text-slate-400 border border-slate-700";
            }
        }

        window.switchTab = async function(tabName) {
            if (window.appState.currentTab === tabName) return;
            if (window.appState.currentTab === 'scanner') {
                await stopCameraStream();
            }
            window.appState.currentTab = tabName;
            updateNavActiveState();
            renderCurrentTab();
        }

        function promptAdminPinVerification(onSuccess) {
            const html = `
                <div id="role-pin-modal" class="fixed inset-0 bg-slate-900/75 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fadeIn">
                    <div class="bg-white w-full max-w-xs rounded-3xl p-5 shadow-2xl space-y-3 text-xs text-center">
                        <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-xl">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <h3 class="font-bold text-sm text-slate-800">ផ្ទៀងផ្ទាត់សិទ្ធិ Admin</h3>
                        <p class="text-[11px] text-slate-500">សូមបញ្ចូលលេខកូដ PIN Admin ដើម្បីប្តូរទៅជា Admin (Default: 1234)</p>
                        
                        <input type="password" id="input-role-pin" placeholder="បញ្ចូល PIN" class="w-full border border-slate-300 rounded-xl p-2.5 text-center font-bold text-base tracking-widest focus:outline-none focus:border-amber-500">
                        
                        <div class="flex space-x-2 pt-2">
                            <button onclick="closeModal('role-pin-modal')" class="flex-1 bg-slate-100 py-2.5 rounded-xl font-bold text-slate-700">បោះបង់</button>
                            <button onclick="verifyRolePinSubmit()" class="flex-1 bg-amber-600 text-white py-2.5 rounded-xl font-bold shadow">ផ្ទៀងផ្ទាត់</button>
                        </div>
                    </div>
                </div>
            `;
            window._pendingPinSuccessCallback = onSuccess;
            const div = document.createElement('div');
            div.id = 'role-pin-wrapper';
            div.innerHTML = html;
            document.body.appendChild(div);
            setTimeout(() => {
                const el = document.getElementById('input-role-pin');
                if (el) el.focus();
            }, 100);
        }

        window.verifyRolePinSubmit = function() {
            const pinInput = document.getElementById('input-role-pin').value.trim();
            if (pinInput === window.appState.adminPin) {
                closeModal('role-pin-modal');
                const wrapper = document.getElementById('role-pin-wrapper');
                if (wrapper) wrapper.remove();
                if (window._pendingPinSuccessCallback) {
                    window._pendingPinSuccessCallback();
                    window._pendingPinSuccessCallback = null;
                }
            } else {
                showToast("លេខកូដ PIN មិនត្រឹមត្រូវឡើយ!", "error");
            }
        }

        async function stopCameraStream() {
            if (html5QrCode) {
                try {
                    if (html5QrCode.isScanning) {
                        await html5QrCode.stop();
                    }
                    await html5QrCode.clear();
                } catch (e) {
                    console.log("Stop camera note:", e);
                } finally {
                    html5QrCode = null;
                }
            }
        }

        function initQrScanner() {
            if (!window.appState.isCameraActive) return;
            setTimeout(() => {
                startScannerInstance();
            }, 250);
        }

        async function startScannerInstance() {
            const readerEl = document.getElementById("reader");
            if (!readerEl || !window.appState.isCameraActive) return;
            
            try {
                await stopCameraStream();
                const readerCheck = document.getElementById("reader");
                if (!readerCheck) return;

                if (typeof Html5Qrcode !== 'undefined') {
                    html5QrCode = new Html5Qrcode("reader");
                    
                    const formats = (typeof Html5QrcodeSupportedFormats !== 'undefined') ? [
                        Html5QrcodeSupportedFormats.QR_CODE,
                        Html5QrcodeSupportedFormats.DATA_MATRIX,
                        Html5QrcodeSupportedFormats.AZTEC
                    ] : undefined;

                    const config = { 
                        fps: 10,
                        qrbox: (viewfinderWidth, viewfinderHeight) => {
                            const minDim = Math.min(viewfinderWidth, viewfinderHeight);
                            return { width: Math.floor(minDim * 0.85), height: Math.floor(minDim * 0.85) };
                        },
                        aspectRatio: 1.0,
                        ...(formats ? { formatsToSupport: formats } : {}),
                        experimentalFeatures: {
                            useBarCodeDetectorIfSupported: true
                        }
                    };
                    await html5QrCode.start(
                        { facingMode: "environment" }, 
                        config, 
                        (decodedText) => { handleScannedResult(decodedText); }, 
                        () => {}
                    );
                }
            } catch (err) {
                console.log("Camera access or init note:", err);
            }
        }

        window.simulateScan = function(id) {
            handleScannedResult(id);
        }

        window.processManualQuickId = function() {
            const input = document.getElementById('manual-quick-id');
            if (!input || !input.value.trim()) {
                showToast("សូមបញ្ចូល ID សិស្ស ឬ គ្រូជាមុនសិន!", "error");
                return;
            }
            handleScannedResult(input.value.trim());
            input.value = '';
        }

        function handleScannedResult(rawCode) {
            if (isProcessingScan) return;
            isProcessingScan = true;

            let code = rawCode.trim();

            if (code.includes('SYNC_DATA') || code.includes('"type":"SYNC_DATA"')) {
                try {
                    const syncObj = JSON.parse(code);
                    if (syncObj && syncObj.type === 'SYNC_DATA') {
                        processImportedQrSyncData(syncObj);
                        setTimeout(() => { isProcessingScan = false; }, 2500);
                        return;
                    }
                } catch (e) {
                    console.error("Sync QR parse error:", e);
                }
            }

            if (code.startsWith('{') && code.endsWith('}')) {
                try {
                    const parsed = JSON.parse(code);
                    if (parsed.type === 'SYNC_DATA') {
                        processImportedQrSyncData(parsed);
                        setTimeout(() => { isProcessingScan = false; }, 2500);
                        return;
                    }
                    code = parsed.id || parsed.code || parsed.studentId || parsed.teacherId || code;
                } catch (e) {
                    console.log("JSON parse fallback");
                }
            }

            const lowerCode = code.toLowerCase();
            const mode = window.appState.scannerMode;
            let target = null;
            let typeName = '';

            if (mode === 'student') {
                target = window.appState.students.find(s => 
                    s.id.toLowerCase() === lowerCode || 
                    s.name.toLowerCase().includes(lowerCode) ||
                    (s.parentPhone && s.parentPhone.includes(code))
                );
                typeName = 'student';
            } else {
                target = window.appState.teachers.find(t => 
                    t.id.toLowerCase() === lowerCode || 
                    t.name.toLowerCase().includes(lowerCode) ||
                    (t.phone && t.phone.includes(code))
                );
                typeName = mode;
            }

            if (!target) {
                target = { 
                    id: code, 
                    name: `កាតក្រៅប្រព័ន្ធ (${code})`, 
                    classId: 'ទូទៅ', 
                    parentPhone: '' 
                };
            }

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const timeStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

            const record = {
                id: 'ATT-' + Date.now(),
                recordId: target.id || code,
                name: target.name || code,
                type: typeName,
                classId: target.classId || 'ទូទៅ',
                status: mode === 'teacher_in' ? 'ចូលរៀន (Check-in)' : (mode === 'teacher_out' ? 'ចេញរៀន (Check-out)' : 'មកទាន់ពេល'),
                time: timeStr,
                note: mode === 'teacher_out' ? 'បញ្ចប់ម៉ោងបង្រៀន' : 'ស្កែន QR ស្វ័យប្រវត្តិ'
            };

            window.appState.attendance.unshift(record);
            syncToFirebase('attendance', record.id, record);

            sendTelegramNotification(record);
            sendGoogleSheetNotification(record);

            showToast(`កត់ត្រាជោគជ័យ៖ ${target.name} (${record.status})`, "success");
        }

        function sendGoogleSheetNotification(record) {
            const sheetUrl = window.appState.googleSheetUrl || 'https://script.google.com/macros/s/AKfycbyhca0dGNj8CV41xUzZZcGUplmuoAQ3kCzg2jN0M8VLo3Gva1RDzlKPcpx4CZNC-0zPsw/exec';
            if (!sheetUrl) return;

            const payload = {
                id: record.id || ('ATT-' + Date.now()),
                personId: record.recordId || record.id || '',
                name: record.name || '',
                role: record.type || 'student',
                type: record.type || 'student',
                grade: record.classId || 'ទូទៅ',
                classId: record.classId || 'ទូទៅ',
                status: record.status || 'មកទាន់ពេល',
                timestamp: record.time || '',
                time: record.time || '',
                note: record.note || 'ស្កែន QR ស្វ័យប្រវត្តិ'
            };

            const formBody = new URLSearchParams();
            Object.keys(payload).forEach(key => {
                formBody.append(key, payload[key]);
            });

            fetch(sheetUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: formBody.toString()
            }).then(() => {
                console.log("✅ Google Sheet Sync Request Sent for:", record.name);
            }).catch(e => console.log("Google Sheet sync note:", e));
        }

        window.saveManualAttendance = function() {
            const inputVal = document.getElementById('man-att-id').value.trim();
            const classId = document.getElementById('man-att-class').value;
            const status = document.getElementById('man-att-status').value;

            if (!inputVal) {
                showToast("សូមបញ្ចូល អត្តលេខ ឬ ឈ្មោះសិស្ស!", "error");
                return;
            }

            const student = window.appState.students.find(s => s.id === inputVal || s.name.includes(inputVal));
            const now = new Date();
            const timeStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

            const record = {
                id: 'ATT-' + Date.now(),
                recordId: student ? student.id : inputVal,
                name: student ? student.name : inputVal,
                type: 'student',
                classId: classId,
                status: status,
                time: timeStr,
                note: 'កត់វត្តមានដោយដៃ'
            };

            window.appState.attendance.unshift(record);
            syncToFirebase('attendance', record.id, record);
            sendTelegramNotification(record);
            sendGoogleSheetNotification(record);

            showToast(`បានកត់វត្តមានសិស្ស៖ ${record.name} (${status})`, "success");
            closeModal('manual-att-modal');
            renderCurrentTab();
        }

        window.saveEditPerson = function(type, id) {
            const name = document.getElementById('edit-p-name').value.trim();
            const extra = document.getElementById('edit-p-extra').value.trim();
            const phone = document.getElementById('edit-p-phone').value.trim();

            if (type === 'student') {
                const idx = window.appState.students.findIndex(s => s.id === id);
                if (idx !== -1) {
                    window.appState.students[idx].name = name;
                    window.appState.students[idx].classId = extra;
                    window.appState.students[idx].parentPhone = phone;
                    syncToFirebase('students', id, window.appState.students[idx]);
                }
            } else {
                const idx = window.appState.teachers.findIndex(t => t.id === id);
                if (idx !== -1) {
                    window.appState.teachers[idx].name = name;
                    window.appState.teachers[idx].subject = extra;
                    window.appState.teachers[idx].phone = phone;
                    syncToFirebase('teachers', id, window.appState.teachers[idx]);
                }
            }
            showToast("កែប្រែទិន្នន័យជោគជ័យ!", "success");
            closeModal('edit-person-modal');
            renderCurrentTab();
        }

        window.openQrSyncExportModal = async function() {
            try {
                const syncKey = 'SYNC-' + Date.now();
                const syncPayload = {
                    type: "SYNC_DATA_KEY",
                    key: syncKey,
                    ver: "1.0",
                    timestamp: Date.now(),
                    students: window.appState.students || [],
                    teachers: window.appState.teachers || [],
                    timetable: window.appState.timetable || []
                };

                const qrCodeString = JSON.stringify({ type: "SYNC_DATA_KEY", key: syncKey });

                const html = `
                    <div id="qr-sync-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fadeIn">
                        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-4">

                                <button onclick="closeModal('qr-sync-modal')" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                            </div>

                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 flex justify-center">
                                <div id="qrcode-sync-render" class="p-2 bg-white rounded-xl shadow-sm border border-slate-200 min-h-[180px] min-w-[180px] flex items-center justify-center overflow-hidden"></div>
                            </div>
                            <div class="flex space-x-2">

                            </div>
                        </div>
                    </div>
                `;
                const container = document.getElementById('modal-container');
                if (container) container.innerHTML = html;

                setTimeout(() => {
                    const el = document.getElementById('qrcode-sync-render');
                    if (el) {
                        el.innerHTML = '';
                        const enc = encodeURIComponent(qrCodeString);
                        el.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${enc}" class="w-44 h-44 rounded-lg object-contain shadow-inner" alt="Sync QR Code" onerror="this.onerror=null; this.src='https://placehold.co/180x180/10b981/ffffff?text=QR+Code+Sync';">`;
                    }
                }, 100);

                syncToFirebase('sync_payloads', syncKey, syncPayload);

                console.error("openQrSyncExportModal error:", err);
                showToast("មានបញ្ហាក្នុងការបង្កើត QR Sync", "error");

        window.processImportedQrSyncData = async function(parsedObj) {
            try {
                if (parsedObj && parsedObj.key) {
                    showToast("កំពុងទាញយកទិន្នន័យ Sync ពី Cloud...", "info");
                    if (isFirebaseConnected) {
                        try {
                            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'sync_payloads'));
                            let foundData = null;
                            snap.forEach(d => {
                                if (d.id === parsedObj.key) foundData = d.data();
                            });

                            if (foundData) {
                                if (foundData.students && foundData.students.length > 0) window.appState.students = foundData.students;
                                if (foundData.teachers && foundData.teachers.length > 0) window.appState.teachers = foundData.teachers;
                                if (foundData.timetable && foundData.timetable.length > 0) window.appState.timetable = foundData.timetable;

                                saveToLocalStorage();
                                renderCurrentTab();
                                showToast("Sync ទិន្នន័យឆ្លងទូរស័ព្ទជោគជ័យ!", "success");
                                return;
                            }
                        } catch (cloudFetchErr) {
                            console.error("Cloud fetch sync error:", cloudFetchErr);
                        }
                    }
                }
                showToast("មិនអាចស្វែងរកទិន្នន័យ QR Sync នេះឡើយ!", "error");
            } catch (e) {
                console.error("processImportedQrSyncData error:", e);
                showToast("មានបញ្ហាក្នុងការទទួល Sync QR", "error");
            }
        }

        window.saveNewTimetable = function() {
            const classId = document.getElementById('tt-class').value;
            const day = document.getElementById('tt-day').value;
            const shift = document.getElementById('tt-shift').value;
            const period = document.getElementById('tt-period').value.trim();
            const subject = document.getElementById('tt-subject').value.trim();
            const teacher = document.getElementById('tt-teacher').value;

            if (!period || !subject) {
                showToast("សូមបញ្ចូល ម៉ោង និង មុខវិជ្ជា!", "error");
                return;
            }

            const item = {
                id: 'TT-' + Date.now(),
                classId,
                day,
                shift,
                period,
                subject,
                teacher
            };

            window.appState.timetable.push(item);
            syncToFirebase('timetable', item.id, item);

            showToast("បន្ថែមម៉ោងសិក្សាជោគជ័យ!", "success");
            closeModal('add-tt-modal');
            renderCurrentTab();
        }

                            <button onclick="closeModal('guide-modal')" class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <p class="text-[11px] text-slate-600">សូមចម្លង (Copy) កូដខាងក្រោម យកទៅ Paste ក្នុង Google Sheet របស់អ្នក (Extensions ➔ Apps Script) រួច Deploy ជា Web App (Anyone) យក URL មកបិទក្នុង Settings ៖</p>
                        <textarea readonly class="w-full h-40 bg-slate-900 text-emerald-400 p-3 rounded-2xl font-mono text-[10px] select-all leading-relaxed">${scriptCode}</textarea>
                        <div class="flex justify-end pt-1">
                            <button onclick="closeModal('guide-modal')" class="bg-brand-600 text-white font-bold px-4 py-2 rounded-xl">យល់ព្រម</button>
                        </div>
                    </div>
                </div>
            `;
            const container = document.getElementById('modal-container');
            if (container) container.innerHTML = html;
        }

        function renderScannerView() {
            const mode = window.appState.scannerMode;
            return `
                <div class="p-4 space-y-4">
                    <div class="bg-gradient-to-r from-emerald-900 to-green-900 text-white rounded-3xl p-4 shadow-lg space-y-3">
                        <div class="flex justify-between items-center">
                            <h2 class="font-bold text-xs uppercase tracking-wider text-emerald-300"><i class="fa-solid fa-camera mr-1.5"></i>ម៉ាស៊ីនស្កែន QR វត្តមាន</h2>
                            <span class="bg-emerald-500/30 border border-emerald-400/30 text-emerald-200 text-[10px] px-2.5 py-0.5 rounded-full font-bold flex items-center gap-1">
                                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> ដំណើរការ
                            </span>
                        </div>
                        <div class="grid grid-cols-3 gap-1.5 bg-emerald-950/60 p-1.5 rounded-2xl border border-emerald-800">
                            <button onclick="setScannerMode('student')" class="py-2 rounded-xl text-[11px] font-bold transition ${mode==='student'?'bg-emerald-500 text-slate-950 shadow':'text-emerald-200 hover:bg-emerald-800/50'}">
                                <i class="fa-solid fa-graduation-cap mr-1"></i>សិស្ស
                            </button>
                            <button onclick="setScannerMode('teacher_in')" class="py-2 rounded-xl text-[11px] font-bold transition ${mode==='teacher_in'?'bg-emerald-500 text-slate-950 shadow':'text-emerald-200 hover:bg-emerald-800/50'}">
                                <i class="fa-solid fa-right-to-bracket mr-1"></i>គ្រូ Check-in
                            </button>
                            <button onclick="setScannerMode('teacher_out')" class="py-2 rounded-xl text-[11px] font-bold transition ${mode==='teacher_out'?'bg-emerald-500 text-slate-950 shadow':'text-emerald-200 hover:bg-emerald-800/50'}">
                                <i class="fa-solid fa-right-from-bracket mr-1"></i>គ្រូ Check-out
                            </button>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl p-3 shadow-sm border border-slate-200 flex flex-col items-center relative overflow-hidden">
                        <div id="reader" class="w-full h-64 rounded-2xl bg-slate-900 overflow-hidden relative shadow-inner border border-slate-200"></div>
                        <p class="text-[10px] text-slate-400 mt-2 text-center"><i class="fa-solid fa-expand mr-1"></i>តម្រង់កាមេរ៉ាលើ QR Code ដើម្បីកត់វត្តមានស្វ័យប្រវត្តិ</p>
                    </div>

                    <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 space-y-2">
                        <label class="block font-bold text-xs text-slate-700"><i class="fa-solid fa-keyboard text-brand-600 mr-1"></i>បញ្ចូល ID ដោយដៃ (Quick Manual Input)</label>
                        <div class="flex space-x-2">
                            <input type="text" id="manual-quick-id" placeholder="បញ្ចូល ID សិស្ស ឬ គ្រូ..." class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-brand-500 font-bold">
                            <button onclick="processManualQuickId()" class="bg-brand-600 hover:bg-brand-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition">បញ្ចូល</button>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 space-y-2">
                        <h3 class="font-bold text-xs text-slate-800 border-b border-slate-100 pb-2 flex justify-between items-center">
                            <span><i class="fa-solid fa-history text-amber-500 mr-1.5"></i>វត្តមានចុងក្រោយក្នុងប្រព័ន្ធ</span>
                            <span class="text-[10px] text-slate-400 font-normal">(${window.appState.attendance.length})</span>
                        </h3>
                        <div class="space-y-1.5 max-h-40 overflow-y-auto hide-scrollbar">
                            ${window.appState.attendance.slice(0, 5).map(a => `
                                <div class="flex justify-between items-center p-2 rounded-xl bg-slate-50 border border-slate-100 text-xs">
                                    <div>
                                        <p class="font-bold text-slate-800">${a.name} <span class="text-[10px] font-normal text-slate-500">(${a.classId})</span></p>
                                        <p class="text-[10px] text-emerald-600 font-medium">${a.status} • ${a.time.split(' ')[1]}</p>
                                    </div>
                                    <span class="text-[9px] bg-slate-200 text-slate-700 px-2 py-0.5 rounded-lg font-bold">${a.type}</span>
                                </div>
                            `).join('') || '<p class="text-center text-xs text-slate-400 py-3">មិនទាន់មានវត្តមាននៅឡើយ</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        window.setScannerMode = function(mode) {
            window.appState.scannerMode = mode;
            renderCurrentTab();
        }

        function renderCurrentTab() {
            const main = document.getElementById('main-content');
            if (!main) return;

            const current = window.appState.currentTab;

            if (current === 'scanner') {
                main.innerHTML = renderScannerView();
                initQrScanner();
            } else if (current === 'attendance') {
                main.innerHTML = renderAttendanceView();
            } else if (current === 'people') {
                main.innerHTML = renderPeopleView();
            } else if (current === 'timetable') {
                main.innerHTML = renderTimetableView();
            } else if (current === 'reports') {
                main.innerHTML = renderReportsView();
            }
        }

        window.showToast = function(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const colors = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                info: 'bg-slate-800 text-white'
            };

            const toast = document.createElement('div');
            toast.className = `${colors[type] || colors.info} p-3 rounded-2xl shadow-xl text-xs font-bold flex items-center justify-between transition-all duration-300 transform translate-y-2 pointer-events-auto border border-white/20`;
            toast.innerHTML = `
                <span>${msg}</span>
                <button onclick="this.parentElement.remove()" class="ml-3 text-white/80 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.closeModal = function(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.remove();
        }

        window.sendTelegramNotification = function(record) {
            const cfg = window.appState.telegramConfig;
            if (!cfg.autoSendOnScan || !cfg.botToken) return;

            const targetChatId = cfg.classChatIds[record.classId] || cfg.defaultChatId;
            if (!targetChatId) return;

            const text = `🔔 *វត្តមានសាលារៀន - វិទ្យាល័យឥស្លាមស្ទឹងត្រែង*\n\n` +
                         `👤 *ឈ្មោះ:* ${record.name}\n` +
                         `🆔 *ID:* \`${record.recordId}\`\n` +
                         `🏫 *ថ្នាក់/មុខវិជ្ជា:* ${record.classId}\n` +
                         `📌 *ស្ថានភាព:* ${record.status}\n` +
                         `⏰ *ម៉ោង:* ${record.time}`;

            const url = `https://api.telegram.org/bot${cfg.botToken}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: targetChatId, text: text, parse_mode: 'Markdown' })
            }).catch(e => console.log("Telegram send note:", e));
        }

        window.sendClassReportToTelegram = function() {
            const cfg = window.appState.telegramConfig;
            if (!cfg.botToken || !cfg.defaultChatId) {
                showToast("សូមរៀបចំ Telegram Bot Token និង Chat ID ក្នុង Settings ជាមុនសិន!", "error");
                return;
            }

            const atts = window.appState.attendance;
            const text = `📊 *របាយការណ៍សង្ខេបវត្តមានសរុប*\n\n` +
                         `សរុបវត្តមាន៖ ${atts.length} នាក់\n` +
                         `មកទាន់ពេល៖ ${atts.filter(a=>a.status==='មកទាន់ពេល').length} នាក់\n` +
                         `មកយឺត៖ ${atts.filter(a=>a.status==='មកយឺត').length} នាក់\n` +
                         `សុំច្បាប់/អវត្តមាន៖ ${atts.filter(a=>a.status==='សុំច្បាប់'||a.status==='អវត្តមាន').length} នាក់`;

            const url = `https://api.telegram.org/bot${cfg.botToken}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: cfg.defaultChatId, text: text, parse_mode: 'Markdown' })
            }).then(() => showToast("ផ្ញើរបាយការណ៍ទៅ Telegram ជោគជ័យ!", "success"))
              .catch(() => showToast("មានបញ្ហាក្នុងការផ្ញើទៅ Telegram", "error"));
        }

        window.downloadBackupJson = function() {
            const data = {
                students: window.appState.students,
                teachers: window.appState.teachers,
                attendance: window.appState.attendance,
                timetable: window.appState.timetable
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ST_School_Backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            showToast("ទាញយក Backup File ជោគជ័យ!", "success");
        }

        window.exportToExcel = function() {
            try {
                if (typeof XLSX === 'undefined') {
                    showToast("កំពុងទាញយក Library... សូមព្យាយាមម្តងទៀត", "info");
                    return;
                }
                const wb = XLSX.utils.book_new();
                const attData = window.appState.attendance.map(a => ({
                    ID: a.recordId,
                    ឈ្មោះ: a.name,
                    ប្រភេទ: a.type,
                    ថ្នាក់: a.classId,
                    ស្ថានភាព: a.status,
                    កាលបរិច្ឆេទ: a.time,
                    ចំណាំ: a.note || ''
                }));
                const ws = XLSX.utils.json_to_sheet(attData);
                XLSX.utils.book_append_sheet(wb, ws, "Attendance");
                XLSX.writeFile(wb, `Attendance_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
                showToast("ទាញយក Excel File ជោគជ័យ!", "success");
            } catch (e) {
                console.error("Excel Export error:", e);
                showToast("បញ្ហាក្នុងការបង្កើត Excel File", "error");
            }
        }

        window.testTelegramConnection = function() {
            const token = document.getElementById('cfg-bot-token').value.trim();
            const chatId = document.getElementById('cfg-chat-id').value.trim();
            if (!token || !chatId) {
                showToast("សូមបញ្ចូល Bot Token និង Chat ID ជាមុនសិន!", "error");
                return;
            }
            const url = `https://api.telegram.org/bot${token}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: "✅ សាកល្បងភ្ជាប់ប្រព័ន្ធវត្តមាន វិទ្យាល័យឥស្លាមស្ទឹងត្រែង ជោគជ័យ!" })
            }).then(r => r.json()).then(res => {
                if (res.ok) showToast("ផ្ញើសារសាកល្បងទៅ Telegram ជោគជ័យ!", "success");
                else showToast("មិនអាចផ្ញើបាន៖ " + (res.description || "Error"), "error");
            }).catch(() => showToast("មានបញ្ហាក្នុងការភ្ជាប់ទៅ Telegram", "error"));
        }

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>
</body>
</html>
